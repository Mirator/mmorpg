name: E2E

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E suites
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmorpg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL_E2E: postgresql://postgres:postgres@localhost:5432/mmorpg_e2e?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Reset E2E database
        run: npm run db:reset:e2e

      - name: Run main E2E suite
        run: npm run test:e2e

      - name: Run admin E2E suite
        run: npm run test:e2e:admin

